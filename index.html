<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bitácora de Compras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --navy:#16374E; --navy-2:#1E4560; --ink:#182430; --muted:#64748B; --line:#E2E8F0;
    --bg:#F3F6F8; --card:#FFFFFF;
    --sabbag:#1B3A63; --sabbag-soft:#EAF0F8;
    --ciclotron:#0FA9C7; --ciclotron-soft:#E7F8FB;
    --ok:#1F8F5F; --ok-soft:#E5F5EC;
    --warn:#B9740E; --warn-soft:#FBF0DD;
    --bad:#B23B2E; --bad-soft:#FBEAE7;
    --neutral:#5B6B7A; --neutral-soft:#EEF1F4;
    box-sizing:border-box;
    padding-top: env(safe-area-inset-top,0px);
    padding-bottom: env(safe-area-inset-bottom,0px);
  }
  *,*:before,*:after{box-sizing:inherit}
  html{scroll-padding-top: env(safe-area-inset-top,0px)}
  body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);height:100%}
  html,body{height:100%}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ } }
  .mono{font-family:'IBM Plex Mono',monospace}
  button{font-family:inherit}
  a{color:inherit}

  #shell{display:flex;min-height:100%}
  #sidebar{
    width:236px;flex:0 0 236px;background:var(--navy);color:#fff;
    display:flex;flex-direction:column;padding:20px 14px;gap:2px;
    overflow:hidden;white-space:nowrap;transition:width .18s ease, padding .18s ease, flex-basis .18s ease;
  }
  body.sidebar-collapsed #sidebar{width:0;flex:0 0 0;padding-left:0;padding-right:0;border:none}
  #sidebarToggle{
    flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:8px;width:32px;height:32px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);
  }
  #sidebarToggle:hover{color:var(--ink);border-color:#c7d2dc}
  #sidebarToggle svg{width:16px;height:16px;transition:transform .18s ease}
  body.sidebar-collapsed #sidebarToggle svg{transform:rotate(180deg)}
  .brand{padding:2px 8px 18px;font-weight:800;font-size:17px;letter-spacing:.2px}
  .brand small{display:block;font-weight:500;font-size:11.5px;color:#9FB6C9;margin-top:2px}
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;
    color:#CBD9E4;text-decoration:none;font-size:13.5px;font-weight:500;cursor:pointer;
    border:none;background:none;width:100%;text-align:left;
  }
  .nav-item svg{flex:0 0 18px;width:18px;height:18px;opacity:.9}
  .nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
  .nav-item.active{background:rgba(255,255,255,.12);color:#fff}
  .nav-sep{height:1px;background:rgba(255,255,255,.12);margin:10px 4px}
  .nav-label{font-size:10.5px;color:#7C93A6;padding:10px 10px 4px;font-weight:600}
  .nav-group-head{
    display:flex;align-items:center;gap:6px;padding:9px 10px;border-radius:8px;
    color:#fff;font-size:12.5px;font-weight:700;cursor:pointer;border:none;background:none;
    width:100%;text-align:left;text-transform:none;margin-top:8px;
  }
  .nav-group-head:first-of-type{margin-top:0}
  .nav-group-head .chev{width:13px;height:13px;transition:transform .15s;flex:0 0 13px}
  .nav-group-head.active .chev{transform:rotate(90deg)}
  .nav-group-head:hover{background:rgba(255,255,255,.06)}
  .nav-group{padding-left:2px}
  #sidebar .spacer{flex:1}
  .usuario-box{padding:10px;font-size:11.5px;color:#9FB6C9;border-top:1px solid rgba(255,255,255,.12);margin-top:6px}
  .usuario-box #usuarioRol{color:#7C93A6;font-weight:400}

  #main{flex:1;display:flex;flex-direction:column;min-width:0}
  #topbar{
    display:flex;align-items:center;gap:16px;padding:12px 22px;background:#fff;
    border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;
  }
  .company-switch{display:flex;background:var(--bg);border-radius:9px;padding:3px;gap:2px}
  .company-btn{
    border:none;background:none;padding:7px 14px;border-radius:7px;font-size:13px;font-weight:600;
    cursor:pointer;color:var(--muted);display:flex;align-items:center;gap:7px;
  }
  .company-dot{width:8px;height:8px;border-radius:50%}
  .company-btn.active{background:#fff;box-shadow:0 1px 3px rgba(20,40,60,.12)}
  .company-btn[data-c="sabbag"].active{color:var(--sabbag)}
  .company-btn[data-c="ciclotron"].active{color:var(--ciclotron)}
  #topbar .spacer{flex:1}
  .top-title{font-size:14.5px;color:var(--muted)}
  .top-title b{color:var(--ink)}

  #content{flex:1;padding:22px 26px 60px;overflow:auto;min-width:0}
  .page-head{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
  .page-head h1{font-size:21px;margin:0;font-weight:700}
  .page-head .sub{color:var(--muted);font-size:13px;margin-top:3px}
  .actions{display:flex;gap:8px;flex-wrap:wrap}

  .btn{border:1px solid var(--line);background:#fff;padding:8px 13px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
  .btn:hover{border-color:#c7d2dc}
  .btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
  .btn.primary:hover{background:var(--navy-2)}
  .btn.ghost{border-color:transparent;background:transparent}
  .btn.danger{color:var(--bad)}
  .btn:disabled{opacity:.5;cursor:default}
  .btn svg{width:14px;height:14px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:11px}
  .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
  .kpi{padding:15px 16px;background:#fff;border:1px solid var(--line);border-radius:11px}
  .kpi .n{font-size:26px;font-weight:800;line-height:1.1}
  .kpi .l{font-size:12px;color:var(--muted);margin-top:4px}

  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
  .filters input[type=text], .filters select{
    border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;background:#fff;color:var(--ink)
  }
  .filters input[type=text]{min-width:200px}

  table{width:100%;border-collapse:collapse;font-size:13.2px}
  thead th{text-align:left;color:var(--muted);font-weight:600;font-size:11.5px;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
  thead th.sortable{cursor:pointer;user-select:none}
  thead th.sortable:hover{color:var(--ink)}
  tbody td{padding:10px 12px;border-bottom:1px solid #EEF1F4;vertical-align:middle;text-align:left}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:#F8FAFB}
  .table-wrap{overflow-x:auto;border-radius:11px;border:1px solid var(--line);background:#fff}
  .num{font-weight:600}
  .muted{color:var(--muted)}
  .empty-state{padding:50px 20px;text-align:center;color:var(--muted)}
  .empty-state .big{font-size:15px;color:var(--ink);font-weight:600;margin-bottom:6px}

  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:100px;font-size:11.5px;font-weight:600;white-space:nowrap}
  .badge .d{width:6px;height:6px;border-radius:50%}
  .b-ok{background:var(--ok-soft);color:var(--ok)}
  .b-warn{background:var(--warn-soft);color:var(--warn)}
  .b-bad{background:var(--bad-soft);color:var(--bad)}
  .b-neutral{background:var(--neutral-soft);color:var(--neutral)}

  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  @media (max-width:920px){.detail-grid{grid-template-columns:1fr}}
  .detail-grid-doc{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;align-items:start}
  @media (max-width:980px){.detail-grid-doc{grid-template-columns:1fr}}
  .field-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px 18px;padding:18px}
  .field-grid .f label{display:block;font-size:11px;color:var(--muted);margin-bottom:3px;font-weight:600}
  .field-grid .f .v{font-size:13.8px;font-weight:500}
  .section-title{font-size:12.5px;font-weight:700;color:var(--muted);padding:14px 18px 6px;border-top:1px solid var(--line)}
  .section-title:first-child{border-top:none}

  .rel-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fafcfd;padding:6px 11px;border-radius:8px;font-size:12.5px;cursor:pointer;margin:0 6px 6px 0}
  .rel-chip:hover{border-color:#c7d2dc;background:#fff}
  .rel-chip .t{font-size:10.5px;color:var(--muted)}

  .timeline{padding:4px 18px 18px}
  .tl-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed #E8EDF1}
  .tl-item:last-child{border-bottom:none}
  .tl-dot{width:8px;height:8px;border-radius:50%;background:var(--navy-2);margin-top:6px;flex:0 0 8px}
  .tl-body{flex:1;font-size:13px}
  .tl-meta{color:var(--muted);font-size:11.5px;margin-top:2px}

  .side-card{padding:16px 18px}
  .side-card h3{font-size:13px;margin:0 0 10px;font-weight:700}
  select.estado-select{width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--line);font-size:13px;font-family:inherit;margin-bottom:8px}
  textarea.nota-input{width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--line);font-size:13px;font-family:inherit;min-height:64px;resize:vertical;margin-bottom:8px}

  .modal-backdrop{position:fixed;inset:0;background:rgba(20,30,40,.4);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
  .modal{background:#fff;border-radius:13px;max-width:480px;width:100%;max-height:86vh;overflow:auto;padding:22px}
  .modal.wide{max-width:1220px}
  .modal h2{margin:0 0 4px;font-size:16.5px}
  .modal p.sub{color:var(--muted);font-size:12.5px;margin:0 0 16px}
  .modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
  .modal-close{background:none;border:none;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:2px 6px;border-radius:6px}
  .modal-close:hover{background:var(--bg);color:var(--ink)}
  .field-grid .f.editing input, .field-grid .f.editing select{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:13px;font-family:inherit}
  .item-actions-cell{white-space:nowrap;text-align:right}
  .icon-actions{display:inline-flex;align-items:center;gap:9px}
  .icon-btn{background:none;border:none;cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:7px;padding:0}
  .icon-btn svg{width:17px;height:17px}
  .icon-btn:hover{background:var(--bg);color:var(--navy-2)}
  .icon-btn.gestion{color:#3E6FA3}
  .icon-btn.gestion:hover{background:#EAF1F8;color:#325A85}
  .icon-btn.ver{color:#3FA871}
  .icon-btn.ver:hover{background:#E8F6EE;color:#33875C}
  .icon-divider{width:1px;height:16px;background:var(--line)}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12px;font-weight:600;margin-bottom:5px}
  .field input, .field select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit}
  .drop{border:1.5px dashed #C7D2DC;border-radius:10px;padding:26px;text-align:center;color:var(--muted);font-size:13px;cursor:pointer}
  .drop.over{border-color:var(--navy);background:#F5F9FC}
  .drop input{display:none}

  .import-summary{background:var(--neutral-soft);border-radius:9px;padding:12px 14px;font-size:12.8px;margin-top:12px;line-height:1.7}
  .import-summary b{color:var(--ink)}
  .toast{position:fixed;bottom:22px;right:22px;background:var(--navy);color:#fff;padding:12px 16px;border-radius:9px;font-size:13px;box-shadow:0 8px 24px rgba(20,40,60,.25);z-index:80;max-width:340px}
  .toast.err{background:var(--bad)}
  .barmini{height:6px;border-radius:4px;background:var(--neutral-soft);overflow:hidden;display:flex;margin-top:6px}
  .barmini span{height:100%}
  .link-btn{background:none;border:none;color:var(--navy-2);font-weight:600;font-size:12.5px;cursor:pointer;padding:0;text-decoration:underline}
  .warn-box{background:var(--warn-soft);color:#7A5106;border-radius:9px;padding:10px 13px;font-size:12.5px;margin-bottom:12px}
</style>
</head>
<body>
<div id="shell">
  <div id="sidebar">
    <div class="brand">Bitácora de Compras<small>Sabbag · Ciclotron · build 2026-09-29-v21</small></div>

    <button class="nav-group-head active" data-group="compras">
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
      Gestión de compras
    </button>
    <div class="nav-group" id="group-compras">
      <button class="nav-item" data-route="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="5" rx="1.5"/><rect x="13" y="11" width="8" height="10" rx="1.5"/><rect x="3" y="14" width="8" height="7" rx="1.5"/></svg>
        Panel
      </button>
      <div class="nav-label">Documentos</div>
      <button class="nav-item" data-route="sc">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 3h6l4 4v14H5V3z"/><path d="M9 12h6M9 16h6M9 8h2"/></svg>
        Solicitudes
      </button>
      <button class="nav-item" data-route="oc">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16v5H4z"/><path d="M6 9v11h12V9M9 13h6"/></svg>
        Órdenes de Compra
      </button>
      <button class="nav-item" data-route="rar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8M12 13v8"/></svg>
        Recepciones (RAR)
      </button>
      <button class="nav-item" data-route="fact">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h9l3 3v15H6z"/><path d="M9 9h6M9 13h6M9 17h4"/></svg>
        Facturación
      </button>
      <div class="nav-sep"></div>
      <button class="nav-item" data-route="importar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 19h16"/></svg>
        Importar Excel
      </button>
    </div>

    <button class="nav-group-head" data-group="alistamiento">
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
      Alistamiento de facturas
    </button>
    <div class="nav-group" id="group-alistamiento" style="display:none">
      <button class="nav-item" data-route="alistamiento">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 6L9 17l-5-5"/></svg>
        Entrega a Contabilidad
      </button>
    </div>

    <div class="spacer"></div>
    <div class="usuario-box">Sesión de<br><b id="usuarioNombre" style="color:#fff">—</b><span id="usuarioRol"></span></div>
  </div>

  <div id="main">
    <div id="topbar">
      <button id="sidebarToggle" title="Mostrar/ocultar panel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="company-switch" id="companySwitch">
        <button class="company-btn" data-c="sabbag"><span class="company-dot" style="background:var(--sabbag)"></span>Sabbag Radiólogos</button>
        <button class="company-btn" data-c="ciclotron"><span class="company-dot" style="background:var(--ciclotron)"></span>Ciclotron Caribe</button>
      </div>
      <div class="spacer"></div>
      <div class="top-title" id="dbStatus">Conectando…</div>
    </div>
    <div id="content"></div>
  </div>
</div>
<div id="modalRoot"></div>
<div id="descPopoverRoot"></div>

<script>
/* ============================================================
   CONFIGURACIÓN GENERAL
   ============================================================ */
const EMPRESAS = {
  sabbag:    { label: 'Sabbag Radiólogos', color: 'var(--sabbag)', soft: 'var(--sabbag-soft)' },
  ciclotron: { label: 'Ciclotron Caribe',  color: 'var(--ciclotron)', soft: 'var(--ciclotron-soft)' },
};

// íconos de acción para cada registro de un listado: Gestión (estado/novedad/bitácora) y Ver detalle
const ICON_GESTION = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="14.31" y1="8" x2="20.05" y2="17.94"/><line x1="9.69" y1="8" x2="21.17" y2="8"/><line x1="7.38" y1="12" x2="13.12" y2="2.06"/><line x1="9.69" y1="16" x2="3.95" y2="6.06"/><line x1="14.31" y1="16" x2="2.83" y2="16"/><line x1="16.62" y1="12" x2="10.88" y2="21.94"/></svg>`;
const ICON_VER = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
// ícono para "ver descripción completa" (columnas de texto largo en tablas de ítems)
const ICON_TEXTO = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v5a2 2 0 0 0 2 2h5"/><path d="M6 3h8l6 6v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="14" y2="17"/></svg>`;

// popover simple (independiente de #modalRoot, para no cerrar el modal de fondo) para textos largos como Descripción
function mostrarDescripcionTooltip(btn){
  const texto = btn.dataset.desc || '';
  let root = document.getElementById('descPopoverRoot');
  if (!root){ root = document.createElement('div'); root.id = 'descPopoverRoot'; document.body.appendChild(root); }
  root.innerHTML = `<div class="modal-backdrop" style="z-index:90" id="descBackdrop">
    <div class="modal" style="max-width:520px">
      <div class="modal-head">
        <h2 style="margin:0;font-size:14.5px">Descripción</h2>
        <button class="modal-close" id="btnCerrarDesc">✕</button>
      </div>
      <div style="padding:2px 2px 6px;font-size:13.5px;white-space:pre-wrap;line-height:1.5">${esc(texto) || '<span class="muted">Sin descripción.</span>'}</div>
    </div>
  </div>`;
  document.getElementById('descBackdrop').addEventListener('click', (e)=>{ if (e.target.id==='descBackdrop') root.innerHTML=''; });
  document.getElementById('btnCerrarDesc').addEventListener('click', ()=>{ root.innerHTML=''; });
}

// tono visual de cada estado -> clase de badge
const TONE = {
  // positivo / cerrado
  'Aprobada':'ok', 'Cerrada':'ok', 'Recepción completa':'ok', 'Pagada':'ok', 'Con OC generada':'ok',
  // en curso / atención
  'Pendiente':'warn', 'Abierta':'warn', 'Parcialmente recibida':'warn', 'Recepción parcial':'warn',
  'Registrada':'neutral', 'Enviada a contabilidad':'warn',
  // negativo
  'Rechazada':'bad', 'Cancelada':'bad', 'Anulada':'bad',
  // validación de pago (OC)
  'Sin factura':'neutral', 'Sin pago':'warn', 'Anticipo':'warn', 'Pagado':'ok', 'Mayor pago':'bad',
};

const TIPOS = {
  sc: {
    key:'sc', coleccion:'solicitudes', singular:'Solicitud', plural:'Solicitudes de compra',
    numField:'nro_sc', fechaField:'fecha_sc', estadoCol:'estado_sc',
    sheets:{cab:'cab_sc', det:'det_sc'},
    estadosSugeridos: ['Pendiente aprobación','Aprobada','Rechazada','Con OC generada','Cancelada'],
    cabCols: ['id_sc_cab','nro_sc','fecha_sc','solicitante','nota','subsidiaria','quien_autoriza','estado_sc'],
    detCols: ['id_sc_det','id_sc_cab','nro_sc','item_articulo','cantidad_sc','departamento','subdepartamento','ubicacion','descripcion'],
    cabFields: [

const state = {
  empresa: localStorage.getItem('compras_empresa') || 'sabbag',
  route: 'dashboard',
  routeArg: null,
  db: null,
  downloadsCap: null,
  userCap: null,
  me: null,
  estadosCatalog: null,
  cache: {}, // coleccion -> array de docs (para la empresa activa)
};

function fmtMoney(v){
  if (v===null || v===undefined || v==='') return '—';
  const n = Number(v); if (isNaN(n)) return String(v);
  return '$' + n.toLocaleString('es-CO', {maximumFractionDigits:0});
}
function fmtDate(v){
  if (!v) return '—';
  let d = v instanceof Date ? v : new Date(v);
  if (isNaN(d.getTime())) return String(v);
  return d.toLocaleDateString('es-CO', {day:'2-digit', month:'short', year:'numeric'});
}
function fmtDateTime(v){
  let d = v instanceof Date ? v : new Date(v);
  if (isNaN(d.getTime())) return '';
  return d.toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric'}) + ' · ' + d.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});
}
function slugId(s){ return String(s==null?'':s).trim().replace(/[^A-Za-z0-9_-]+/g,'-').replace(/^-+|-+$/g,'') || 'sr'; }
function periodFrom(dateVal){
  let d = dateVal instanceof Date ? dateVal : new Date(dateVal);
  if (isNaN(d.getTime())) return 'sf';
  return d.getFullYear() + String(d.getMonth()+1).padStart(2,'0');
}
function mapSubsidiaria(raw){
  const s = String(raw||'').toUpperCase();
  if (s.includes('SABBAG')) return 'sabbag';
  if (s.includes('CICLOTRON')) return 'ciclotron';
  return null;
}
// el almacenamiento solo acepta JSON plano: convierte fechas (y cualquier otro tipo no-plano) a texto
function toPlainJSON(v){
  return JSON.parse(JSON.stringify(v));
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// devuelve siempre un array: protege contra un documento con 'detalle' corrupto (no-array) que,
// sin esto, rompería con una excepción todo cálculo que recorra varios documentos a la vez
// (p. ej. el índice de recepción de TODAS las RAR de la empresa) por culpa de un solo registro dañado.
function arr(v){ return Array.isArray(v) ? v : []; }
function toast(msg, isErr){
  const t = document.createElement('div');
  t.className = 'toast' + (isErr?' err':'');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 4200);
}
function estadosDisponibles(tipoKey, docs){
  const cfg = TIPOS[tipoKey];
  const base = (state.estadosCatalog && state.estadosCatalog[tipoKey]) || cfg.estadosSugeridos;
  const set = new Set(base);
  (docs||[]).forEach(d=> d.estado && set.add(d.estado));
  return Array.from(set);
}
const ITEM_ESTADOS_SUGERIDOS = ['Sin gestionar','En revisión','Conforme','Con novedad'];
function estadosDisponiblesItem(currentEstado){
  const base = (state.estadosCatalog && state.estadosCatalog.item) || ITEM_ESTADOS_SUGERIDOS;
  const set = new Set(base);
  if (currentEstado) set.add(currentEstado);
  return Array.from(set);
}
async function ensureEstadosCatalog(){
  if (state.estadosCatalog) return state.estadosCatalog;
  const defaults = { sc:[...TIPOS.sc.estadosSugeridos], oc:[...TIPOS.oc.estadosSugeridos], rar:[...TIPOS.rar.estadosSugeridos], fact:[...TIPOS.fact.estadosSugeridos], item:[...ITEM_ESTADOS_SUGERIDOS] };
  if (!state.db){ state.estadosCatalog = defaults; return state.estadosCatalog; }
  try{
    const ref = state.db.doc('config/estados');
    const snap = await ref.get();
    if (snap.exists){ state.estadosCatalog = {...defaults, ...snap.data()}; }
    else { state.estadosCatalog = defaults; await ref.set(toPlainJSON(defaults)); }
  }catch(e){ console.error(e); state.estadosCatalog = defaults; }
  return state.estadosCatalog;
}
// agrega estados nuevos (no vistos antes) al catálogo persistido, para ese tipo de documento ('sc'|'oc'|'rar'|'fact'|'item')
async function addEstadosToCatalog(tipoKey, estados){
  const nuevos = Array.from(new Set((estados||[]).filter(Boolean)));
  if (!nuevos.length) return;
  const cat = await ensureEstadosCatalog();
  const merged = Array.from(new Set([...(cat[tipoKey]||[]), ...nuevos]));
  if (merged.length === (cat[tipoKey]||[]).length) return; // nada nuevo
  cat[tipoKey] = merged;
  if (state.db){
    try{ await state.db.doc('config/estados').update(toPlainJSON({[tipoKey]: merged})); }
    catch(e){ try{ await state.db.doc('config/estados').set(toPlainJSON(cat)); }catch(e2){ console.error(e2); } }
  }
}
function badge(estado){
  const tone = TONE[estado] || 'neutral';
  return `<span class="badge b-${tone}"><span class="d" style="background:currentColor"></span>${esc(estado||'—')}</span>`;
}

async function loadColeccion(coleccion){
  if (!state.db) return [];
  try {
    const snap = await state.db.collection(coleccion).where('empresa','==', state.empresa).get();
    const docs = snap.docs.map(d => ({...d.data(), _id: d.id}));
    state.cache[coleccion] = docs;
    return docs;
  } catch(e){
    console.error(e);
    toast('No se pudo leer ' + coleccion + ': ' + (e.message||e.code||''), true);
    return [];
  }
}

async function getAllCached(coleccion){
  if (state.cache[coleccion]) return state.cache[coleccion];
  return await loadColeccion(coleccion);
}

async function pushBackref(coleccion, docId, field, value){
  if (!state.db) return;
  const ref = state.db.collection(coleccion).doc(docId);

/* ============================================================
   RECEPCIÓN (RAR) APLICADA A LOS ÍTEMS DE OC
   El estado/las cantidades del detalle de OC se calculan a partir
   de las RAR relacionadas (vía id_oc_det), nunca se editan a mano.
   ============================================================ */
// índice: id_oc_det (string) -> {cant, valor} sumado desde todas las RAR de la empresa activa
// ocId opcional: si se pasa, solo se suman las RAR realmente vinculadas a esa OC (rar.oc_id === ocId).
// Esto evita que un id_oc_det coincidente de otra OC (colisión de ids) se cruce con el ítem equivocado.
async function getRecepcionIndex(ocId){
  const rarDocs = await getAllCached('recepciones');
  const idx = {};
  rarDocs.forEach(r=>{
    if (ocId && r.oc_id !== ocId) return;
    arr(r.detalle).forEach(it=>{
      const key = (it.id_oc_det!=null && it.id_oc_det!=='') ? String(it.id_oc_det) : null;
      if (!key) return;
      if (!idx[key]) idx[key] = { cant:0, valor:0 };
      idx[key].cant += Number(it.cantidad_rar)||0;
      idx[key].valor += Number(it.valor_total_item_rar)||0;
    });
  });
  return idx;
}
function recepcionDeItem(it, recepIdx){
  return (recepIdx && recepIdx[String(it.id_oc_det)]) || { cant:0, valor:0 };
}
function estadoRecepcionItem(it, recepIdx){
  const rec = recepcionDeItem(it, recepIdx);
  const cantOc = Number(it.cantidad_oc)||0;
  if (rec.cant<=0) return 'Sin recepción';
  if (rec.cant + 1e-6 >= cantOc) return 'Recepción total';
  return 'Recepción parcial';
}
// una OC se considera "completa" cuando, para todos sus ítems, la cantidad Y el valor
// recibidos (según las RAR relacionadas) igualan a lo ordenado
function ocEstaCompleta(ocDoc, recepIdx){
  const items = arr(ocDoc.detalle);
  if (!items.length) return false;
  return items.every(it=>{
    const rec = recepcionDeItem(it, recepIdx);
    const cantOk = Math.abs((Number(it.cantidad_oc)||0) - rec.cant) < 0.01;
    const valOk = Math.abs((Number(it.valor_total_item_oc)||0) - rec.valor) < 0.01;
    return cantOk && valOk;
  });
}

// moneda/valor originales de una OC: todos sus ítems comparten la misma moneda de origen;
// la cabecera solo muestra la moneda (del primer ítem que la tenga) y la suma de los valores originales
function ocOrigenAgregado(ocDoc){
  const items = arr(ocDoc.detalle);
  const conMoneda = items.find(it=> it.moneda_original);
  const total = items.reduce((s,it)=> s + (Number(it.valor_original)||0), 0);
  return { moneda: conMoneda ? conMoneda.moneda_original : null, total };
}

/* ============================================================
   PROVEEDOR (derivado): RAR y Factura no traen su propio proveedor,
   se hereda de la OC de origen siguiendo el enlace (Factura -> RAR -> OC,
   o Factura -> OC directo si fue vinculada manualmente sin RAR)
   ============================================================ */
async function resolverProveedor(tipoKey, d){
  if (tipoKey==='oc') return d.proveedor || null;
  if (tipoKey==='rar'){
    if (!d.oc_id || !state.db) return null;
    const snap = await state.db.collection('ordenes').doc(d.oc_id).get();
    return snap.exists ? (snap.data().proveedor || null) : null;
  }
  if (tipoKey==='fact'){
    if (!state.db) return null;
    let ocId = d.oc_id || null;
    if (!ocId && d.rar_id){
      const rarSnap = await state.db.collection('recepciones').doc(d.rar_id).get();
      if (rarSnap.exists) ocId = rarSnap.data().oc_id || null;
    }
    if (!ocId) return null;
    const ocSnap = await state.db.collection('ordenes').doc(ocId).get();
    return ocSnap.exists ? (ocSnap.data().proveedor || null) : null;
  }
  return null;
}

/* ============================================================
   VALIDACIÓN DE PAGO (OC): compara lo pagado (pago_realizado, del Excel
   de OC) contra lo que indican las facturas asociadas (valor_a_pagar),
   siguiendo el enlace OC -> RAR -> Factura
   ============================================================ */
async function facturasDeOC(ocId){
  if (!state.db || !ocId) return [];
  const rarAll = await getAllCached('recepciones');
  const rarIds = rarAll.filter(r=> r.oc_id===ocId).map(r=> r._id);
  if (!rarIds.length) return [];
  const factAll = await getAllCached('facturas');
  return factAll.filter(f=> f.rar_id && rarIds.includes(f.rar_id));
}
function validacionPago(ocDoc, facturas){
  const raw = ocDoc.pago_realizado;
  const pagadoNum = Number(raw);
  const p = (raw==null || raw==='' || isNaN(pagadoNum)) ? 0 : pagadoNum;
  if (!facturas.length) return 'Sin factura';
  if (p <= 0) return 'Sin pago';
  const aPagar = facturas.reduce((s,f)=> s + (Number(f.valor_a_pagar)||0), 0);
  if (Math.abs(p - aPagar) < 0.01) return 'Pagado';
  if (p < aPagar) return 'Anticipo';
  return 'Mayor pago';
}

// detecta el tipo de documento mirando qué hojas trae el libro
function detectTipo(workbook){
  const names = workbook.SheetNames;
  for (const key of Object.keys(TIPOS)){
    const sh = TIPOS[key].sheets;
    if (names.includes(sh.cab) && names.includes(sh.det)) return key;
  }
  return null;
}

function extractRows(sheet, expectedFirstCol){
  if (!sheet) return [];
  const rows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:true, defval:null});
  let headerIdx = rows.findIndex(r => r && r[0] !== null && String(r[0]).trim() === expectedFirstCol);
  if (headerIdx === -1) return { error: `No se encontró la columna "${expectedFirstCol}" en la hoja.` };
  const headers = rows[headerIdx].map(h => h==null ? '' : String(h).trim());
  const data = [];
  for (let i=headerIdx+1; i<rows.length; i++){
    const r = rows[i];
    if (!r || r.every(c=>c===null || c==='')) continue;
    if (r[0]===null || r[0]==='') continue;
    const obj = {};
    headers.forEach((h,idx)=>{ if (h) obj[h] = (r[idx]===undefined ? null : r[idx]); });
    data.push(obj);
  }
  return { rows: data };
}

async function parseWorkbookFile(wb, tipoKey){
  const names = TIPOS[tipoKey].sheets;
  const cabSheet = wb.Sheets[names.cab];
  const detSheet = wb.Sheets[names.det];
  if (!cabSheet) throw new Error(`No encontré la hoja "${names.cab}" en el archivo.`);
  const cabRes = extractRows(cabSheet, TIPOS[tipoKey].cabCols[0]);
  if (cabRes.error) throw new Error(cabRes.error);
  const detRes = detSheet ? extractRows(detSheet, TIPOS[tipoKey].detCols[0]) : {rows:[]};
  if (detRes.error) throw new Error(detRes.error);
  return { cab: cabRes.rows, det: detRes.rows };
}

// agrupa detalle por el id de cabecera (dentro del mismo archivo)
function groupDet(detRows, cabIdField){
  const map = {};
  detRows.forEach(r=>{
    const k = String(r[cabIdField]);
    (map[k] = map[k]||[]).push(r);
  });
  return map;
}

// intenta determinar la empresa de una fila de cabecera según el tipo de documento.
// detalleRows: filas de detalle ya agrupadas para esta cabecera (se usan para el caso factura-sin-RAR).
async function resolveEmpresa(tipoKey, row, detalleRows){
  if (tipoKey==='sc' || tipoKey==='oc'){
    const direct = mapSubsidiaria(row.subsidiaria);
    if (direct) return direct;
  }
  if (tipoKey==='oc' && row.id_sc_cab){
    const sc = await findByOrigen('solicitudes', null, 'id_sc_cab', row.id_sc_cab);
    if (sc) return sc.empresa;
  }
  if (tipoKey==='rar' && row.id_oc_cab){
    const oc = await findByOrigen('ordenes', null, 'id_oc_cab', row.id_oc_cab);
    if (oc) return oc.empresa;
  }
  if (tipoKey==='fact'){
    if (row.id_rar_cab){
      const rar = await findByOrigen('recepciones', null, 'id_rar_cab', row.id_rar_cab);
      if (rar) return rar.empresa;
    }
    // sin RAR (proceso manual): intenta resolver vía id_oc_det del detalle
    const primerDet = (detalleRows||[]).find(dd=> dd.id_oc_det!=null);
    if (primerDet){
      const oc = await findOcByDetId(null, primerDet.id_oc_det);
      if (oc) return oc.empresa;
    }
  }
  return null;
}

// preserva estado/bitácora de cada ítem existente al reimportar, emparejando por su id estable de origen (id_xx_det)
function mergeDetalle(existingDetalle, rawDetRows, cfg){
  const detIdCol = cfg.detCols[0];
  const existingByKey = {};
  arr(existingDetalle).forEach(it=>{ if (it[detIdCol]!=null) existingByKey[String(it[detIdCol])] = it; });
  return rawDetRows.map(raw=>{
    const o = {};
    cfg.detCols.forEach(c=>{ if(c in raw) o[c]=raw[c]; });
    const key = raw[detIdCol]!=null ? String(raw[detIdCol]) : null;
    const prev = key!=null ? existingByKey[key] : null;
    if (prev){
      o.estado = prev.estado || 'Sin gestionar';
      o.bitacora = prev.bitacora || [];
      if (cfg.itemExtraFields) cfg.itemExtraFields.forEach(f=>{ if (prev[f.k]!=null) o[f.k] = prev[f.k]; });
    } else {
      o.estado = 'Sin gestionar';
      o.bitacora = [{ fecha: new Date().toISOString(), autor:'Importación', tipo:'importacion', nota:'Ítem creado desde archivo Excel', estado_nuevo:'Sin gestionar' }];
      if (cfg.itemExtraFields) cfg.itemExtraFields.forEach(f=>{ o[f.k] = null; });
    }
    return o;
  });
}

async function runImport(tipoKey, cab, det, onProgress){
  const cfg = TIPOS[tipoKey];
  const cabIdCol = cfg.cabCols[0]; // id_xx_cab
  const detGroupCol = cfg.detCols[1]; // segunda columna del detalle siempre es el id de cabecera
  const detByCab = groupDet(det, detGroupCol);
  await ensureEstadosCatalog();

  let creados=0, actualizados=0, sinNumero=0, sinResolver=0;
  const porEmpresa = { sabbag:0, ciclotron:0 };
  const estadosNuevos = new Set();
  for (const row of cab){
    const numero = cfg.idFrom(row);
    if (!numero){ sinNumero++; continue; }

    const detalleRaw = detByCab[String(row[cabIdCol])] || [];
    const empresa = await resolveEmpresa(tipoKey, row, detalleRaw);
    if (!empresa){ sinResolver++; continue; }

    const periodo = periodFrom(row[cfg.fechaField]);
    const docId = empresa + '_' + tipoKey + '_' + periodo + '_' + slugId(numero);
    const ref = state.db.collection(cfg.coleccion).doc(docId);
    const existing = await ref.get();
    const detalle = mergeDetalle(existing.exists ? existing.data().detalle : [], detalleRaw, cfg);

    const payload = { empresa, tipo: tipoKey };
    cfg.cabCols.forEach(c => payload[c] = (row[c]===undefined?null:row[c]));
    payload['_origen_'+cabIdCol] = row[cabIdCol]!=null ? String(row[cabIdCol]) : null;
    payload.detalle = detalle;
    if (tipoKey==='oc') payload._det_ids = detalleRaw.map(dd=> dd.id_oc_det!=null ? String(dd.id_oc_det) : null).filter(Boolean);
    payload.actualizado_en = new Date().toISOString();

    // resolver enlace hacia el documento "padre" según el tipo
    let vinculoNota = '';
    if (tipoKey==='oc' && row.id_sc_cab){
      const sc = await findByOrigen('solicitudes', empresa, 'id_sc_cab', row.id_sc_cab);
      if (sc){ payload.sc_id = sc._id; vinculoNota = ` · vinculada a solicitud ${sc.nro_sc}`; await pushBackref('solicitudes', sc._id, 'oc_ids', docId); }
      else { payload.sc_id = null; }
    }
    if (tipoKey==='rar' && row.id_oc_cab){
      const oc = await findByOrigen('ordenes', empresa, 'id_oc_cab', row.id_oc_cab);
      if (oc){ payload.oc_id = oc._id; vinculoNota = ` · vinculada a OC ${oc.nro_oc}`; await pushBackref('ordenes', oc._id, 'rar_ids', docId); }
      else { payload.oc_id = null; }
    }
    if (tipoKey==='fact'){
      payload.rar_id = null; payload.oc_id = null;
      if (row.id_rar_cab){
        const rar = await findByOrigen('recepciones', empresa, 'id_rar_cab', row.id_rar_cab);
        if (rar){ payload.rar_id = rar._id; vinculoNota = ` · vinculada a RAR ${rar.nro_rar}`; await pushBackref('recepciones', rar._id, 'factura_ids', docId); }
      }
      if (!payload.rar_id){
        // sin RAR: intenta ubicar la OC directamente vía id_oc_det del detalle (proceso manual)
        const primerDet = detalleRaw.find(dd=> dd.id_oc_det!=null);
        if (primerDet){
          const oc = await findOcByDetId(empresa, primerDet.id_oc_det);
          if (oc){ payload.oc_id = oc._id; vinculoNota = ` · vinculada a OC ${oc.nro_oc} (sin RAR, proceso manual)`; }
        }
      }
    }

    if (existing.exists){
      const prevData = existing.data();
      const prevBit = prevData.bitacora || [];
      let notaExtra = [{ fecha: new Date().toISOString(), autor:'Importación', tipo:'importacion', nota: 'Actualizado desde archivo Excel' + vinculoNota }];
      // OC: si el valor pagado cambió respecto a la importación anterior, deja registro en la bitácora
      if (tipoKey==='oc'){
        const antes = (prevData.pago_realizado==null || prevData.pago_realizado==='') ? null : Number(prevData.pago_realizado);
        const ahora = (payload.pago_realizado==null || payload.pago_realizado==='') ? null : Number(payload.pago_realizado);
        const cambioValido = (antes==null && ahora!=null) || (antes!=null && ahora==null) || (antes!=null && ahora!=null && Math.abs(antes-ahora)>=0.01);
        if (cambioValido){
          notaExtra.push({ fecha: new Date().toISOString(), autor:'Importación', tipo:'cambio_valor_pagado', nota:`Cambió valor pagado: ${fmtMoney(antes)} → ${fmtMoney(ahora)}`, valor_anterior: antes, valor_nuevo: ahora });
        }
      }
      payload.bitacora = [...prevBit, ...notaExtra];
      payload.estado = prevData.estado; // conserva el estado gestionado en la app
      await ref.update(toPlainJSON(payload));
      actualizados++; porEmpresa[empresa]++;
    } else {
      const estadoCol = cfg.estadoCol;
      const estadoExcel = estadoCol ? row[estadoCol] : null;
      payload.estado = (estadoExcel && String(estadoExcel).trim()) ? String(estadoExcel).trim() : cfg.estadosSugeridos[0];
      if (!(state.estadosCatalog[tipoKey]||[]).includes(payload.estado)) estadosNuevos.add(payload.estado);
      payload.creado_en = new Date().toISOString();
      payload.bitacora = [{ fecha: new Date().toISOString(), autor:'Importación', tipo:'importacion', nota: 'Creado desde archivo Excel' + vinculoNota, estado_nuevo: payload.estado }];
      await ref.set(toPlainJSON(payload));
      creados++; porEmpresa[empresa]++;
    }
    if (onProgress) onProgress(creados+actualizados, cab.length);
  }
  delete state.cache[cfg.coleccion];
  if (estadosNuevos.size) await addEstadosToCatalog(tipoKey, Array.from(estadosNuevos));
  return { creados, actualizados, sinNumero, sinResolver, total: cab.length, porEmpresa };
}
