function navigate(route, arg){
  if (route==='importar' && !(state.me && state.me.canEdit)){
    toast('Solo quien administra esta app puede importar bases.', true);
    return;
  }
  state.route = route; state.routeArg = arg||null;
  document.querySelectorAll('.nav-item').forEach(b=> b.classList.toggle('active', b.dataset.route===route));
  render();
  document.getElementById('content').scrollTo(0,0);
}

async function render(){
  const el = document.getElementById('content');
  el.innerHTML = '<div class="empty-state">Cargando…</div>';
  try{
    if (state.route==='dashboard') await renderDashboard(el);
    else if (['sc','oc','rar','fact'].includes(state.route)) await renderList(el, state.route);
    else if (state.route==='importar') renderImportar(el);
    else if (state.route==='alistamiento') renderAlistamiento(el);
  }catch(e){
    console.error(e);
    el.innerHTML = `<div class="empty-state"><div class="big">Ocurrió un error</div>${esc(e.message||String(e))}</div>`;
  }
}

/* ---------------- DASHBOARD ---------------- */
async function renderDashboard(el){
  const [sc, oc, rar, fact] = await Promise.all([
    getAllCached('solicitudes'), getAllCached('ordenes'), getAllCached('recepciones'), getAllCached('facturas')
  ]);
  const empresaLabel = EMPRESAS[state.empresa].label;

  function estadoBreakdown(docs, cfg){
    const counts = {};
    docs.forEach(d=> counts[d.estado] = (counts[d.estado]||0)+1 );
    return counts;
  }
  function miniBars(counts, total){
    const colors = {ok:'var(--ok)', warn:'var(--warn)', bad:'var(--bad)', neutral:'var(--neutral)'};
    if (!total) return '<div class="barmini"></div>';
    return '<div class="barmini">' + Object.entries(counts).filter(([,n])=>n>0).map(([est,n])=>{
      const tone = TONE[est]||'neutral';
      return `<span style="width:${(n/total*100)}%;background:${colors[tone]}" title="${esc(est)}: ${n}"></span>`;
    }).join('') + '</div>';
  }

  const valorOCAbiertas = oc.filter(o=>o.estado!=='Cerrada' && o.estado!=='Cancelada').reduce((s,o)=>s+(Number(o.valor_total)||0),0);
  const valorFacturado = fact.reduce((s,f)=>s+(Number(f.valor_total_fact)||0),0);
  const ocSinSolicitud = oc.filter(o=>!o.sc_id).length;
  const factSinRar = fact.filter(f=>!f.rar_id).length;

  const modulos = [
    {tipo:'sc', label:'Solicitudes', docs:sc, cfg:TIPOS.sc},
    {tipo:'oc', label:'Órdenes de Compra', docs:oc, cfg:TIPOS.oc},
    {tipo:'rar', label:'Recepciones (RAR)', docs:rar, cfg:TIPOS.rar},
    {tipo:'fact', label:'Facturación', docs:fact, cfg:TIPOS.fact},
  ];

  el.innerHTML = `
    <div class="page-head">
      <div><h1>Panel — ${esc(empresaLabel)}</h1><div class="sub">Estado general del proceso de compras</div></div>
    </div>
    <div class="kpi-row">
      <div class="kpi"><div class="n">${sc.length}</div><div class="l">Solicitudes registradas</div></div>
      <div class="kpi"><div class="n">${oc.length}</div><div class="l">Órdenes de compra</div></div>
      <div class="kpi"><div class="n">${fmtMoney(valorOCAbiertas)}</div><div class="l">Valor en OC abiertas</div></div>
      <div class="kpi"><div class="n">${fmtMoney(valorFacturado)}</div><div class="l">Total facturado</div></div>
    </div>
    ${(ocSinSolicitud||factSinRar) ? `<div class="warn-box">${ocSinSolicitud? ocSinSolicitud+' OC sin solicitud vinculada' : ''}${ocSinSolicitud&&factSinRar?' · ':''}${factSinRar? factSinRar+' facturas sin RAR (proceso manual, revisar vínculo a OC)':''}</div>` : ''}
    <div class="card" style="padding:4px 0">
      ${modulos.map(m=>{
        const counts = estadoBreakdown(m.docs, m.cfg);
        return `<div style="padding:14px 18px;border-bottom:1px solid var(--line);cursor:pointer" onclick="navigate('${m.tipo}')">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <div style="font-weight:600;font-size:13.5px">${m.label}</div>
            <div class="muted" style="font-size:12.5px">${m.docs.length} registros</div>
          </div>
          ${miniBars(counts, m.docs.length)}
          <div style="margin-top:7px;display:flex;gap:12px;flex-wrap:wrap">
            ${Object.entries(counts).filter(([,n])=>n>0).map(([e,n])=>`<span style="font-size:11.5px" class="muted">${esc(e)}: <b style="color:var(--ink)">${n}</b></span>`).join('')}
          </div>
        </div>`;
      }).join('')}
    </div>
  `;
  document.getElementById('sidebar').querySelectorAll('.nav-item[data-route]').forEach(b=>{});
}

/* ---------------- LISTADO ---------------- */
async function renderList(el, tipoKey){
  const cfg = TIPOS[tipoKey];
  const docs = await getAllCached(cfg.coleccion);
  const otraEmpresa = state.empresa==='sabbag' ? 'ciclotron' : 'sabbag';
  let otroCount = 0;
  if (state.db){
    try{ const s = await state.db.collection(cfg.coleccion).where('empresa','==',otraEmpresa).get(); otroCount = s.docs.length; }catch(e){}
  }

  // adjuntar campos derivados para mostrar en la tabla
  const scAll = tipoKey==='oc' ? await getAllCached('solicitudes') : [];
  const ocAll = (tipoKey==='rar' || tipoKey==='sc' || tipoKey==='fact') ? await getAllCached('ordenes') : [];
  const rarAll = (tipoKey==='fact') ? await getAllCached('recepciones') : [];
  const factAll = (tipoKey==='oc') ? await getAllCached('facturas') : [];

  for (const d of docs){
    d._itemCount = arr(d.detalle).length;
    d._ocCount = (d.oc_ids||[]).length;
    if (tipoKey==='oc') d._scLabel = d.sc_id ? (scAll.find(s=>s._id===d.sc_id)?.nro_sc || d.sc_id) : '—';
    if (tipoKey==='rar'){
      d._ocLabel = d.oc_id ? (ocAll.find(o=>o._id===d.oc_id)?.nro_oc || d.oc_id) : '—';
      d._proveedor = d.oc_id ? (ocAll.find(o=>o._id===d.oc_id)?.proveedor || '—') : '—';
    }
    if (tipoKey==='fact'){
      d._rarLabel = d.rar_id ? ('RAR ' + (rarAll.find(r=>r._id===d.rar_id)?.nro_rar || d.rar_id)) : (d.oc_id ? 'Sin RAR (manual)' : 'Sin vincular');
      let ocId = d.oc_id || null;
      if (!ocId && d.rar_id){ const r = rarAll.find(x=>x._id===d.rar_id); ocId = r ? r.oc_id : null; }
      d._proveedor = ocId ? (ocAll.find(o=>o._id===ocId)?.proveedor || '—') : '—';
    }
    if (tipoKey==='sc'){
      const relOc = (d.oc_ids||[]).map(id=> ocAll.find(o=>o._id===id)).filter(Boolean);
      let completas = 0;
      for (const o of relOc){
        const idx = await getRecepcionIndex(o._id); // acotado a cada OC — evita cruces por id_oc_det repetido entre OC
        if (ocEstaCompleta(o, idx)) completas++;
      }
      d._ocCompletas = completas;
      d._ocPendientes = relOc.length - completas;
    }
    if (tipoKey==='oc'){
      const rarDeOc = (await getAllCached('recepciones')).filter(r=> r.oc_id===d._id).map(r=> r._id);
      const facturas = factAll.filter(f=> f.rar_id && rarDeOc.includes(f.rar_id));
      d._validacionPago = validacionPago(d, facturas);
    }
  }

  el.innerHTML = `
    <div class="page-head">
      <div><h1>${cfg.plural}</h1><div class="sub">${EMPRESAS[state.empresa].label} · ${docs.length} registros — ${otroCount ? `${EMPRESAS[otraEmpresa].label}: ${otroCount} más (cambia de pestaña arriba)` : `${EMPRESAS[otraEmpresa].label}: sin registros`}</div></div>
      <div class="actions">
        <button class="btn" id="btnExport"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 19h16"/></svg>Exportar Excel</button>
        ${(state.me && state.me.canEdit) ? `<button class="btn primary" onclick="navigate('importar')">Importar</button>` : ''}
      </div>
    </div>
    <div class="filters">
      <input type="text" id="fBuscar" placeholder="Buscar por número, proveedor, solicitante…">
      <select id="fEstado"><option value="">Todos los estados</option>${estadosDisponibles(tipoKey, docs).map(e=>`<option>${esc(e)}</option>`).join('')}</select>
    </div>
    <div id="listWrap"></div>
  `;

  let sortState = { key: cfg.fechaField, dir: 'desc' };
  function sortRows(rows){
    const {key, dir} = sortState;
    return rows.slice().sort((a,b)=>{
      const av=a[key], bv=b[key];
      const an=Number(av), bn=Number(bv);
      let cmp;
      if (av!=null && bv!=null && av!=='' && bv!=='' && !isNaN(an) && !isNaN(bn)) cmp = an-bn;
      else cmp = String(av??'').localeCompare(String(bv??''), 'es');
      return dir==='asc' ? cmp : -cmp;
    });
  }
  function sortIndicator(key){
    if (sortState.key!==key) return '';
    return sortState.dir==='asc' ? ' ▲' : ' ▼';
  }

  function drawTable(){
    const q = (document.getElementById('fBuscar').value||'').toLowerCase();
    const est = document.getElementById('fEstado').value;
    let rows = docs.filter(d=>{
      if (est && d.estado!==est) return false;
      if (!q) return true;
      const hay = JSON.stringify(d).toLowerCase();
      return hay.includes(q);
    });
    rows = sortRows(rows);
    const wrap = document.getElementById('listWrap');
    if (!rows.length){
      wrap.innerHTML = `<div class="empty-state"><div class="big">No hay ${cfg.plural.toLowerCase()} para mostrar</div>Importa un archivo Excel para empezar a cargar registros.</div>`;
      return;
    }
    wrap.innerHTML = `<div class="table-wrap"><table>
      <thead><tr>
        ${cfg.listCols.map(c=>`<th class="sortable" data-key="${esc(c.k)}">${esc(c.l)}${sortIndicator(c.k)}</th>`).join('')}
        <th class="sortable" data-key="estado">Estado${sortIndicator('estado')}</th>
        <th></th>
      </tr></thead>
      <tbody>${rows.map(d=>`
        <tr onclick="openDocDetalleModal('${tipoKey}', '${esc(d._id)}')">
          ${cfg.listCols.map(c=>{
            let v = d[c.k];
            if (c.k==='_validacionPago') v = badge(v);
            else if (c.fmt==='date') v = fmtDate(v); else if (c.fmt==='money') v = fmtMoney(v); else v = (v==null||v==='') ? '—' : esc(String(v));
            return `<td class="${c.cls||''}">${v}</td>`;
          }).join('')}
          <td>${badge(d.estado)}</td>
          <td class="item-actions-cell">
            <div class="icon-actions">
              <button class="icon-btn gestion" title="Gestionar (estado, novedad, bitácora)" onclick="event.stopPropagation(); openDocGestionModal('${tipoKey}', '${esc(d._id)}')">${ICON_GESTION}</button>
              <span class="icon-divider"></span>
              <button class="icon-btn ver" title="Ver detalle" onclick="event.stopPropagation(); openDocDetalleModal('${tipoKey}', '${esc(d._id)}')">${ICON_VER}</button>
            </div>
          </td>
        </tr>`).join('')}
      </tbody></table></div>
      <div class="muted" style="margin-top:10px;font-size:12px">${rows.length} de ${docs.length} registros</div>`;
    wrap.querySelectorAll('th.sortable').forEach(th=>{
      th.addEventListener('click', ()=>{
        const k = th.dataset.key;
        if (sortState.key===k) sortState.dir = sortState.dir==='asc' ? 'desc' : 'asc';
        else { sortState.key = k; sortState.dir = 'asc'; }
        drawTable();
      });
    });
  }
  drawTable();
  document.getElementById('fBuscar').addEventListener('input', drawTable);
  document.getElementById('fEstado').addEventListener('change', drawTable);
  document.getElementById('btnExport').addEventListener('click', ()=> exportList(tipoKey, docs));
}

async function exportList(tipoKey, docs){
  const cfg = TIPOS[tipoKey];
  const rows = docs.map(d=>{
    const o = {};
    cfg.cabCols.forEach(c=> o[c]=d[c]);
    o.estado_app = d.estado;
    if (tipoKey==='oc'){
      const ag = ocOrigenAgregado(d);
      o.moneda_original = ag.moneda || '';
      o.valor_original = ag.total || '';
    }
    return o;
  });
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, cfg.key);
  const buf = XLSX.write(wb, {type:'array', bookType:'xlsx'});
  const blob = new Blob([buf], {type:'application/octet-stream'});
  try{
    if (!state.downloadsCap){ toast('La descarga no está disponible en esta vista.', true); return; }
    await state.downloadsCap.save({ filename: `${state.empresa}_${cfg.key}_export.xlsx`, data: blob });
    toast('Archivo listo para guardar.');
  }catch(e){ if(e && e.code!=='declined') toast('No se pudo generar el archivo.', true); }
}

/* ---------------- MODAL: DOCUMENTO (cabecera + detalle) ---------------- */
function closeModal(){
  document.getElementById('modalRoot').innerHTML = '';
}
function mountModal(innerHtml, wide){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="modal-backdrop" id="modalBackdrop"><div class="modal ${wide?'wide':''}">${innerHtml}</div></div>`;
  document.getElementById('modalBackdrop').addEventListener('click', (e)=>{ if (e.target.id==='modalBackdrop') closeModal(); });
}

// arma los chips de "documentos relacionados" para una cabecera, según su tipo
async function relacionadosHTML(tipoKey, d){
  let relacionados = '';
  if (tipoKey==='sc' && (d.oc_ids||[]).length){
    const ocAll = await getAllCached('ordenes');
    relacionados += (d.oc_ids||[]).map(id=>{
      const o = ocAll.find(x=>x._id===id);
      return `<div class="rel-chip" onclick="openDocDetalleModal('oc', '${esc(id)}')"><span class="t">OC</span> ${esc(o? o.nro_oc : id)}</div>`;
    }).join('');
  }
  if (tipoKey==='oc'){
    if (d.sc_id){
      const scAll = await getAllCached('solicitudes');
      const s = scAll.find(x=>x._id===d.sc_id);
      relacionados += `<div class="rel-chip" onclick="openDocDetalleModal('sc', '${esc(d.sc_id)}')"><span class="t">Solicitud</span> ${esc(s?s.nro_sc:d.sc_id)}</div>`;
    }
    if ((d.rar_ids||[]).length){
      const rarAll = await getAllCached('recepciones');
      relacionados += (d.rar_ids||[]).map(id=>{
        const r = rarAll.find(x=>x._id===id);
        return `<div class="rel-chip" onclick="openDocDetalleModal('rar', '${esc(id)}')"><span class="t">RAR</span> ${esc(r?r.nro_rar:id)}</div>`;
      }).join('');
    }
  }
  if (tipoKey==='rar'){
    if (d.oc_id){
      const ocAll = await getAllCached('ordenes');
      const o = ocAll.find(x=>x._id===d.oc_id);
      relacionados += `<div class="rel-chip" onclick="openDocDetalleModal('oc', '${esc(d.oc_id)}')"><span class="t">OC</span> ${esc(o?o.nro_oc:d.oc_id)}</div>`;
    }
    if ((d.factura_ids||[]).length){
      const factAll = await getAllCached('facturas');
      relacionados += (d.factura_ids||[]).map(id=>{
        const f = factAll.find(x=>x._id===id);
        return `<div class="rel-chip" onclick="openDocDetalleModal('fact', '${esc(id)}')"><span class="t">Factura</span> ${esc(f?(f.nro_fact_netsuite||f.nro_fact_proveedor):id)}</div>`;
      }).join('');
    }
  }
  if (tipoKey==='fact'){
    if (d.rar_id){
      const rarAll = await getAllCached('recepciones');
      const r = rarAll.find(x=>x._id===d.rar_id);
      relacionados += `<div class="rel-chip" onclick="openDocDetalleModal('rar', '${esc(d.rar_id)}')"><span class="t">RAR</span> ${esc(r?r.nro_rar:d.rar_id)}</div>`;
    } else if (d.oc_id){
      const ocAll = await getAllCached('ordenes');
      const o = ocAll.find(x=>x._id===d.oc_id);
      relacionados += `<div class="rel-chip" onclick="openDocDetalleModal('oc', '${esc(d.oc_id)}')"><span class="t">OC (vínculo manual)</span> ${esc(o?o.nro_oc:d.oc_id)}</div>`;
    }
  }
  return relacionados;
}

/* ---- MODAL 1: GESTIÓN de la cabecera (Cambiar estado / Agregar novedad / Bitácora) ---- */
async function openDocGestionModal(tipoKey, docId){
  const cfg = TIPOS[tipoKey];
  if (!state.db){ toast('Sin conexión al almacenamiento.', true); return; }
  const snap = await state.db.collection(cfg.coleccion).doc(docId).get();
  if (!snap.exists){ toast('No encontré ese registro.', true); return; }
  const d = {...snap.data(), _id: docId};

  mountModal(`
    <div class="modal-head">
      <div>
        <div class="muted" style="font-size:12.5px;margin-bottom:2px">${esc(cfg.plural)} — gestión</div>
        <h2 style="margin:0">${esc(cfg.singular)} ${esc(d[cfg.numField]||'')}</h2>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        ${badge(d.estado)}
        <button class="modal-close" id="btnCerrarGestionModal">✕</button>
      </div>
    </div>
    <div class="detail-grid">
      <div class="card side-card">
        <h3>Cambiar estado</h3>
        <select class="estado-select" id="selEstado">
          ${estadosDisponibles(tipoKey, await getAllCached(cfg.coleccion)).map(e=>`<option ${e===d.estado?'selected':''}>${esc(e)}</option>`).join('')}
          <option value="__otro__">+ Otro estado…</option>
        </select>
        <textarea class="nota-input" id="notaEstado" placeholder="Motivo del cambio (opcional)"></textarea>
        <button class="btn primary" id="btnCambiarEstado" style="width:100%;justify-content:center">Guardar cambio de estado</button>
      </div>
      <div class="card side-card">
        <h3>Agregar novedad</h3>
        <textarea class="nota-input" id="notaLibre" placeholder="Escribe una novedad de seguimiento…"></textarea>
        <button class="btn" id="btnAgregarNota" style="width:100%;justify-content:center">Guardar novedad</button>
      </div>
    </div>
    <div class="card" style="margin-top:14px">
      <div class="section-title">Bitácora</div>
      <div class="timeline">
        ${(d.bitacora||[]).slice().reverse().map(b=>`
          <div class="tl-item">
            <div class="tl-dot"></div>
            <div class="tl-body">
              ${esc(b.nota||'')}
              ${b.estado_nuevo ? `<div style="margin-top:4px">${badge(b.estado_nuevo)}</div>`:''}
              <div class="tl-meta">${esc(b.autor||'—')} · ${fmtDateTime(b.fecha)}</div>
            </div>
          </div>`).join('') || '<div class="muted" style="font-size:12.5px">Sin gestiones registradas aún.</div>'}
      </div>
    </div>
    <div style="margin-top:14px">
      <button class="btn ghost" id="btnVerDetalleDesdeGestion">Ver detalle completo →</button>
    </div>
  `, true);

  document.getElementById('btnCerrarGestionModal').addEventListener('click', closeModal);
  document.getElementById('btnVerDetalleDesdeGestion').addEventListener('click', ()=> openDocDetalleModal(tipoKey, docId));

  document.getElementById('selEstado').addEventListener('change', (e)=>{
    if (e.target.value === '__otro__'){
      const custom = prompt('Escribe el nuevo estado:');
      if (custom && custom.trim()){
        const opt = document.createElement('option');
        opt.value = custom.trim(); opt.textContent = custom.trim(); opt.selected = true;
        e.target.insertBefore(opt, e.target.lastElementChild);
      } else { e.target.value = d.estado; }
    }
  });
  document.getElementById('btnCambiarEstado').addEventListener('click', async ()=>{
    const nuevo = document.getElementById('selEstado').value;
    if (nuevo === '__otro__'){ toast('Elige o escribe un estado válido.', true); return; }
    const nota = document.getElementById('notaEstado') ? document.getElementById('notaEstado').value.trim() : '';
    const autor = autorActual();
    const entry = { fecha:new Date().toISOString(), autor, tipo:'estado', estado_anterior:d.estado, estado_nuevo:nuevo, nota: nota || `Estado cambiado de "${d.estado}" a "${nuevo}"` };
    await state.db.collection(cfg.coleccion).doc(docId).update(toPlainJSON({ estado: nuevo, bitacora: [...(d.bitacora||[]), entry] }));
    await addEstadosToCatalog(tipoKey, [nuevo]);
    delete state.cache[cfg.coleccion];
    toast('Estado actualizado.');
    openDocGestionModal(tipoKey, docId);
  });
  document.getElementById('btnAgregarNota').addEventListener('click', async ()=>{
    const nota = document.getElementById('notaLibre').value.trim();
    if (!nota) return;
    const autor = autorActual();
    const entry = { fecha:new Date().toISOString(), autor, tipo:'nota', nota };
    await state.db.collection(cfg.coleccion).doc(docId).update(toPlainJSON({ bitacora: [...(d.bitacora||[]), entry] }));
    delete state.cache[cfg.coleccion];
    toast('Novedad guardada.');
    openDocGestionModal(tipoKey, docId);
  });
}

/* ---- MODAL 2: DETALLE de la cabecera (Datos generales / Editar / Relacionados / Ítems) ---- */
async function openDocDetalleModal(tipoKey, docId){
  const cfg = TIPOS[tipoKey];
  if (!state.db){ toast('Sin conexión al almacenamiento.', true); return; }
  const snap = await state.db.collection(cfg.coleccion).doc(docId).get();
  if (!snap.exists){ toast('No encontré ese registro.', true); return; }
  const d = {...snap.data(), _id: docId};

  const relacionados = await relacionadosHTML(tipoKey, d);
  const vincularManual = (tipoKey==='fact' && !d.rar_id) ? `<button class="btn ghost" id="btnVincularOc" style="margin-top:2px">+ Vincular a una OC manualmente</button>` : '';

  // para OC: el estado/las cantidades de cada ítem se calculan desde las RAR relacionadas (solo en memoria, para mostrar)
  let recepIdx = null;
  let ocAgregado = null;
  if (tipoKey==='oc'){
    try{
      recepIdx = await getRecepcionIndex(docId);
      // los ítems que llegan del snapshot pueden ser inmutables (no se puede asignar
      // directamente sobre ellos); por eso se reemplaza d.detalle por copias nuevas
      // ANTES de escribir los campos calculados, o la asignación se pierde en silencio.
      d.detalle = arr(d.detalle).map(it => ({...it}));
      d.detalle.forEach(it=>{
        const rec = recepcionDeItem(it, recepIdx);
        it._cantRecibida = rec.cant;
        it._valorRecibido = rec.valor;
        it._cantPendiente = Math.max(0, (Number(it.cantidad_oc)||0) - rec.cant);
        it.estado = estadoRecepcionItem(it, recepIdx);
      });
      ocAgregado = ocOrigenAgregado(d);
    }catch(e){
      console.error('Error calculando recepción de la OC:', e);
      toast('No se pudo calcular la recepción de esta OC (ver consola).', true);
    }
    try{
      const facturas = await facturasDeOC(docId);
      d._validacionPago = validacionPago(d, facturas);
    }catch(e){ console.error('Error calculando validación de pago:', e); }
  }
  if (tipoKey==='rar' || tipoKey==='fact'){
    try{ d._proveedor = await resolverProveedor(tipoKey, d); }catch(e){ console.error('Error resolviendo proveedor:', e); }
  }

  // orden de la tabla de ítems (se conserva mientras el modal está abierto)
  let itemSort = { key: null, dir: 'asc' };
  const detIdCol = cfg.detCols[0];
  const columnasDet = cfg.detCabLabel.map((k,i)=>({k, l:cfg.detHeaders[i]})).concat(cfg.extraDetCols||[]);

  function itemsOrdenados(){
    const items = arr(d.detalle).slice();
    if (!itemSort.key) return items;
    return items.sort((a,b)=>{
      const av=a[itemSort.key], bv=b[itemSort.key];
      const an=Number(av), bn=Number(bv);
      let cmp;
      if (av!=null && bv!=null && av!=='' && bv!=='' && !isNaN(an) && !isNaN(bn)) cmp = an-bn;
      else cmp = String(av??'').localeCompare(String(bv??''), 'es');
      return itemSort.dir==='asc' ? cmp : -cmp;
    });
  }
  function itemSortInd(key){ return itemSort.key===key ? (itemSort.dir==='asc'?' ▲':' ▼') : ''; }

  function drawItemsTable(){
    const wrap = document.getElementById('itemsTableWrap');
    if (!wrap) return;
    const items = itemsOrdenados();
    wrap.innerHTML = `<table><thead><tr>
        ${columnasDet.map(c=>`<th class="sortable" data-key="${esc(c.k)}">${esc(c.l)}${itemSortInd(c.k)}</th>`).join('')}
        <th class="sortable" data-key="estado">Estado${itemSortInd('estado')}</th>
        <th></th>
      </tr></thead>
      <tbody>${items.length ? items.map(it=>`<tr>${columnasDet.map(c=>{
          if (c.k==='descripcion'){
            const texto = (it[c.k]==null || it[c.k]==='') ? '' : String(it[c.k]);
            if (!texto) return `<td class="muted">—</td>`;
            return `<td><button class="icon-btn" title="Ver descripción completa" data-desc="${esc(texto)}" onclick="event.stopPropagation(); mostrarDescripcionTooltip(this)">${ICON_TEXTO}</button></td>`;
          }
          let v = it[c.k];
          if (c.fmt==='money' || c.k.includes('valor')) v = fmtMoney(v); else v = (v==null||v==='')?'—':esc(String(v));
          return `<td>${v}</td>`;
        }).join('')}
        <td>${badge(it.estado || 'Sin gestionar')}</td>
        <td class="item-actions-cell"><button class="btn ghost" style="padding:4px 9px" onclick="openItemModal('${tipoKey}', '${esc(docId)}', '${esc(String(it[detIdCol]))}')">Gestionar</button></td>
      </tr>`).join('') : `<tr><td colspan="${columnasDet.length+2}" class="muted">Sin ítems de detalle.</td></tr>`}</tbody></table>`;
    wrap.querySelectorAll('th.sortable').forEach(th=>{
      th.addEventListener('click', ()=>{
        const k = th.dataset.key;
        if (itemSort.key===k) itemSort.dir = itemSort.dir==='asc' ? 'desc' : 'asc';
        else { itemSort.key = k; itemSort.dir = 'asc'; }
        drawItemsTable();
      });
    });
  }

  const soloLectura = (k)=> k.startsWith('nro_') || k.startsWith('fecha_') || k.startsWith('_');

  function fieldGridHTML(editing){
    return cfg.cabFields.map(f=>{
      const ro = soloLectura(f.k);
      let v = d[f.k];
      if (!editing || ro){
        if (f.k==='_validacionPago') v = badge(v || 'Sin factura');
        else if (f.fmt==='date') v = fmtDate(v); else if (f.fmt==='money') v = fmtMoney(v); else v = (v==null||v==='')?'—':esc(String(v));
        return `<div class="f" style="${f.wide?'grid-column:1/-1':''}"><label>${esc(f.l)}</label><div class="v">${v}</div></div>`;
      }
      const raw = (v==null)?'':v;
      return `<div class="f editing" style="${f.wide?'grid-column:1/-1':''}"><label>${esc(f.l)}</label><input data-field="${esc(f.k)}" data-fmt="${f.fmt||''}" value="${esc(String(raw))}"></div>`;
    }).join('');
  }

  mountModal(`
    <div class="modal-head">
      <div>
        <div class="muted" style="font-size:12.5px;margin-bottom:2px">${esc(cfg.plural)}</div>
        <h2 style="margin:0">${esc(cfg.singular)} ${esc(d[cfg.numField]||'')}</h2>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        ${badge(d.estado)}
        <button class="btn ghost" id="btnIrGestion" style="padding:5px 11px;color:#3E6FA3">${ICON_GESTION} Gestionar</button>
        <button class="modal-close" id="btnCerrarModal">✕</button>
      </div>
    </div>
    <div class="card">
      <div class="section-title" style="display:flex;justify-content:space-between;align-items:center">
        <span>Datos generales</span>
        <button class="btn ghost" id="btnEditarInfo" style="padding:4px 10px">Editar información</button>
      </div>
      <div class="field-grid" id="fieldGrid">${fieldGridHTML(false)}</div>
      <div id="editActions" style="display:none;padding:0 18px 14px;gap:8px">
        <button class="btn primary" id="btnGuardarInfo">Guardar cambios</button>
        <button class="btn ghost" id="btnCancelarInfo">Cancelar</button>
      </div>
      ${tipoKey==='oc' ? `<div class="field-grid" style="padding-top:0">
        <div class="f"><label>Moneda original</label><div class="v">${esc(ocAgregado.moneda || '—')}</div></div>
        <div class="f"><label>Valor original (total)</label><div class="v">${ocAgregado.total ? fmtMoney(ocAgregado.total) : '—'}</div></div>
      </div>` : ''}
      ${relacionados ? `<div class="section-title">Documentos relacionados</div><div style="padding:4px 18px 16px">${relacionados}${vincularManual}</div>` : (vincularManual?`<div class="section-title">Documentos relacionados</div><div style="padding:4px 18px 16px"><span class="muted" style="font-size:12.5px">Sin vincular todavía.</span><br>${vincularManual}</div>`:'')}
      <div class="section-title">Detalle (${arr(d.detalle).length} ítems)</div>
      <div style="padding:0 18px 18px;overflow-x:auto" id="itemsTableWrap"></div>
    </div>
  `, true);

  drawItemsTable();
  document.getElementById('btnCerrarModal').addEventListener('click', closeModal);
  document.getElementById('btnIrGestion').addEventListener('click', ()=> openDocGestionModal(tipoKey, docId));

  document.getElementById('btnEditarInfo').addEventListener('click', ()=>{
    document.getElementById('fieldGrid').innerHTML = fieldGridHTML(true);
    document.getElementById('editActions').style.display = 'flex';
    document.getElementById('btnEditarInfo').style.display = 'none';
  });
  document.getElementById('btnCancelarInfo').addEventListener('click', ()=>{
    document.getElementById('fieldGrid').innerHTML = fieldGridHTML(false);
    document.getElementById('editActions').style.display = 'none';
    document.getElementById('btnEditarInfo').style.display = '';
  });
  document.getElementById('btnGuardarInfo').addEventListener('click', async ()=>{
    const inputs = document.querySelectorAll('#fieldGrid input[data-field]');
    const cambios = {}; const detalles = [];
    inputs.forEach(inp=>{
      const k = inp.dataset.field; const fmt = inp.dataset.fmt;
      let nuevo = inp.value.trim();
      if (fmt==='money') nuevo = Number(nuevo.replace(/[^0-9.-]/g,'')) || 0;
      const anterior = d[k];
      if (String(anterior??'') !== String(nuevo)){
        cambios[k] = nuevo;
        detalles.push(`${k}: "${anterior??''}" → "${nuevo}"`);
      }
    });
    if (!Object.keys(cambios).length){
      document.getElementById('fieldGrid').innerHTML = fieldGridHTML(false);
      document.getElementById('editActions').style.display = 'none';
      document.getElementById('btnEditarInfo').style.display = '';
      return;
    }
    const autor = autorActual();
    const entry = { fecha:new Date().toISOString(), autor, tipo:'edicion', nota:'Información modificada — ' + detalles.join('; ') };
    cambios.bitacora = [...(d.bitacora||[]), entry];
    await state.db.collection(cfg.coleccion).doc(docId).update(toPlainJSON(cambios));
    delete state.cache[cfg.coleccion];
    toast('Información actualizada.');
    openDocDetalleModal(tipoKey, docId);
  });
  const btnVinc = document.getElementById('btnVincularOc');
  if (btnVinc) btnVinc.addEventListener('click', async ()=>{
    const ocAll = await getAllCached('ordenes');
    const nro = prompt('N° de OC a la que quieres vincular esta factura:\n\n' + ocAll.map(o=>o.nro_oc).join(', '));
    if (!nro) return;
    const oc = ocAll.find(o=>String(o.nro_oc).trim()===nro.trim());
    if (!oc){ toast('No encontré esa OC en ' + EMPRESAS[state.empresa].label, true); return; }
    const autor = autorActual();
    const entry = { fecha:new Date().toISOString(), autor, tipo:'vinculo', nota:`Vinculada manualmente a OC ${oc.nro_oc} (factura sin RAR — proceso manual)` };
    await state.db.collection(cfg.coleccion).doc(docId).update(toPlainJSON({ oc_id: oc._id, bitacora:[...(d.bitacora||[]), entry] }));
    delete state.cache[cfg.coleccion];
    toast('Factura vinculada a la OC.');
    openDocDetalleModal(tipoKey, docId);
  });
}

/* ---------------- MODAL: ÍTEM (detalle) ---------------- */
async function openItemModal(tipoKey, docId, itemId){
  const cfg = TIPOS[tipoKey];
  const snap = await state.db.collection(cfg.coleccion).doc(docId).get();
  if (!snap.exists) return;
  const d = {...snap.data(), _id: docId};
  const detIdCol = cfg.detCols[0];
  const idx = arr(d.detalle).findIndex(it => String(it[detIdCol]) === String(itemId));
  if (idx===-1){ toast('No encontré ese ítem.', true); return; }
  // copia nueva: los ítems del snapshot pueden ser inmutables, y más abajo se le asigna item.estado
  const item = {...d.detalle[idx]};

  // en OC, el estado del ítem se calcula desde las RAR relacionadas — no se edita a mano
  const esOc = tipoKey==='oc';
  let recepcion = null;
  if (esOc){
    try{
      const recepIdx = await getRecepcionIndex(docId);
      const rec = recepcionDeItem(item, recepIdx);
      recepcion = { cant: rec.cant, valor: rec.valor, pendiente: Math.max(0, (Number(item.cantidad_oc)||0) - rec.cant), estado: estadoRecepcionItem(item, recepIdx) };
      item.estado = recepcion.estado; // solo para mostrar en este modal
    }catch(e){
      console.error('Error calculando recepción del ítem:', e);
      toast('No se pudo calcular la recepción de este ítem (ver consola).', true);
    }
  }

  function fieldsHTML(editing){
    let html = cfg.detCabLabel.map((k,i)=>{
      let v = item[k];
      if (!editing){
        if (k.includes('valor')) v = fmtMoney(v); else v = (v==null||v==='')?'—':esc(String(v));
        return `<div class="f"><label>${esc(cfg.detHeaders[i])}</label><div class="v">${v}</div></div>`;
      }
      return `<div class="f editing"><label>${esc(cfg.detHeaders[i])}</label><input data-field="${esc(k)}" value="${esc(String(v??''))}"></div>`;
    }).join('');
    if (cfg.itemExtraFields){
      html += cfg.itemExtraFields.map(f=>{
        let v = item[f.k];
        if (!editing){
          const shown = (v==null || v==='') ? '—' : (f.type==='money' ? fmtMoney(v) : esc(String(v)));
          return `<div class="f"><label>${esc(f.l)}</label><div class="v">${shown}</div></div>`;
        }
        if (f.type==='select'){
          const opts = f.options||[];
          return `<div class="f editing"><label>${esc(f.l)}</label><select data-field="${esc(f.k)}">
            <option value="">— Elegir —</option>
            ${opts.map(o=>`<option value="${esc(o)}" ${String(v??'')===o?'selected':''}>${esc(o)}</option>`).join('')}
          </select></div>`;
        }
        return `<div class="f editing"><label>${esc(f.l)}</label><input data-field="${esc(f.k)}" value="${esc(v==null?'':String(v))}"></div>`;
      }).join('');
    }
    return html;
  }

  mountModal(`
    <div class="modal-head">
      <div>
        <div class="muted" style="font-size:12.5px;margin-bottom:2px">${esc(cfg.singular)} ${esc(d[cfg.numField]||'')} — ítem</div>
        <h2 style="margin:0">${esc(item.item_articulo || 'Ítem')}</h2>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        ${badge(item.estado || 'Sin gestionar')}
        <button class="modal-close" id="btnCerrarItemModal">✕</button>
      </div>
    </div>
    <div class="card">
      <div class="section-title" style="display:flex;justify-content:space-between;align-items:center">
        <span>Datos del ítem</span>
        <button class="btn ghost" id="btnEditarItem" style="padding:4px 10px">Editar</button>
      </div>
      <div class="field-grid" id="itemFieldGrid">${fieldsHTML(false)}</div>
      <div id="itemEditActions" style="display:none;padding:0 18px 14px;gap:8px">
        <button class="btn primary" id="btnGuardarItem">Guardar cambios</button>
        <button class="btn ghost" id="btnCancelarItem">Cancelar</button>
      </div>
    </div>
    <div class="detail-grid" style="margin-top:14px">
      <div class="card side-card">
        <h3>${esOc ? 'Estado de recepción (según RAR)' : 'Cambiar estado del ítem'}</h3>
        ${esOc ? `
          <div class="field-grid" style="padding:0;grid-template-columns:1fr 1fr">
            <div class="f"><label>Cant. recibida</label><div class="v">${esc(String(recepcion.cant))}</div></div>
            <div class="f"><label>Vlr. recibido</label><div class="v">${fmtMoney(recepcion.valor)}</div></div>
            <div class="f"><label>Cant. pendiente</label><div class="v">${esc(String(recepcion.pendiente))}</div></div>
            <div class="f"><label>Estado</label><div class="v">${badge(recepcion.estado)}</div></div>
          </div>
          <div class="muted" style="font-size:11.5px;margin-top:8px">Se calcula automáticamente a partir de las RAR vinculadas a este ítem de OC — no se puede cambiar a mano.</div>
        ` : `
          <select class="estado-select" id="selEstadoItem">
            ${estadosDisponiblesItem(item.estado).map(e=>`<option ${e===(item.estado||'Sin gestionar')?'selected':''}>${esc(e)}</option>`).join('')}
            <option value="__otro__">+ Otro estado…</option>
          </select>
          <button class="btn primary" id="btnGuardarEstadoItem" style="width:100%;justify-content:center">Guardar</button>
        `}
      </div>
      <div class="card side-card">
        <h3>Agregar novedad al ítem</h3>
        <textarea class="nota-input" id="notaItem" placeholder="Escribe una novedad sobre este ítem…"></textarea>
        <button class="btn" id="btnAgregarNotaItem" style="width:100%;justify-content:center">Guardar novedad</button>
      </div>
    </div>
    <div class="card" style="margin-top:14px">
      <div class="section-title">Bitácora del ítem</div>
      <div class="timeline">
        ${(item.bitacora||[]).slice().reverse().map(b=>`
          <div class="tl-item"><div class="tl-dot"></div><div class="tl-body">
            ${esc(b.nota||'')}
            ${b.estado_nuevo ? `<div style="margin-top:4px">${badge(b.estado_nuevo)}</div>`:''}
            <div class="tl-meta">${esc(b.autor||'—')} · ${fmtDateTime(b.fecha)}</div>
          </div></div>`).join('') || '<div class="muted" style="font-size:12.5px">Sin gestiones registradas aún para este ítem.</div>'}
      </div>
    </div>
    <div style="margin-top:14px">
      <button class="btn ghost" id="btnVolverCab">← Volver a ${esc(cfg.singular)} ${esc(d[cfg.numField]||'')}</button>
    </div>
  `, true);

  async function guardarItem(cambios, notaBitacora, opts){
    const nuevoDetalle = arr(d.detalle).slice();
    nuevoDetalle[idx] = { ...nuevoDetalle[idx], ...cambios };
    if (notaBitacora){
      const autor = autorActual();
      const entry = { fecha:new Date().toISOString(), autor, ...notaBitacora };
      nuevoDetalle[idx].bitacora = [...(nuevoDetalle[idx].bitacora||[]), entry];
    }
    await state.db.collection(cfg.coleccion).doc(docId).update(toPlainJSON({ detalle: nuevoDetalle }));
    delete state.cache[cfg.coleccion];
    if (opts && opts.msg) toast(opts.msg);
    openItemModal(tipoKey, docId, itemId);
  }

  document.getElementById('btnCerrarItemModal').addEventListener('click', closeModal);
  document.getElementById('btnVolverCab').addEventListener('click', ()=> openDocDetalleModal(tipoKey, docId));
  document.getElementById('btnEditarItem').addEventListener('click', ()=>{
    document.getElementById('itemFieldGrid').innerHTML = fieldsHTML(true);
    document.getElementById('itemEditActions').style.display = 'flex';
    document.getElementById('btnEditarItem').style.display = 'none';
  });
  document.getElementById('btnCancelarItem').addEventListener('click', ()=>{
    document.getElementById('itemFieldGrid').innerHTML = fieldsHTML(false);
    document.getElementById('itemEditActions').style.display = 'none';
    document.getElementById('btnEditarItem').style.display = '';
  });
  document.getElementById('btnGuardarItem').addEventListener('click', async ()=>{
    const inputs = document.querySelectorAll('#itemFieldGrid input[data-field], #itemFieldGrid select[data-field]');
    const cambios = {}; const detalles = [];
    inputs.forEach(inp=>{
      const k = inp.dataset.field;
      let nuevo = inp.value.trim();
      if (inp.tagName==='SELECT' && nuevo===''){ nuevo = null; }
      else if (k.includes('valor') || k.includes('cantidad')) nuevo = Number(nuevo.replace(/[^0-9.-]/g,'')) || 0;
      const anterior = item[k];
      if (String(anterior??'') !== String(nuevo??'')){ cambios[k]=nuevo; detalles.push(`${k}: "${anterior??''}" → "${nuevo??''}"`); }
    });
    if (!Object.keys(cambios).length){ document.getElementById('itemFieldGrid').innerHTML = fieldsHTML(false); document.getElementById('itemEditActions').style.display='none'; document.getElementById('btnEditarItem').style.display=''; return; }
    await guardarItem(cambios, { tipo:'edicion', nota:'Ítem modificado — '+detalles.join('; ') }, { msg:'Ítem actualizado.' });
  });
  const selEstadoItem = document.getElementById('selEstadoItem');
  if (selEstadoItem) selEstadoItem.addEventListener('change', (e)=>{
    if (e.target.value==='__otro__'){
      const custom = prompt('Escribe el nuevo estado para este ítem:');
      if (custom && custom.trim()){
        const opt = document.createElement('option'); opt.value=custom.trim(); opt.textContent=custom.trim(); opt.selected=true;
        e.target.insertBefore(opt, e.target.lastElementChild);
      } else { e.target.value = item.estado || 'Sin gestionar'; }
    }
  });
  const btnGuardarEstadoItem = document.getElementById('btnGuardarEstadoItem');
  if (btnGuardarEstadoItem) btnGuardarEstadoItem.addEventListener('click', async ()=>{
    const nuevo = document.getElementById('selEstadoItem').value;
    if (nuevo==='__otro__'){ toast('Elige o escribe un estado válido.', true); return; }
    await addEstadosToCatalog('item', [nuevo]);
    await guardarItem({ estado: nuevo }, { tipo:'estado', estado_anterior: item.estado||'Sin gestionar', estado_nuevo: nuevo, nota:`Estado del ítem cambiado a "${nuevo}"` }, { msg:'Estado del ítem actualizado.' });
  });
  document.getElementById('btnAgregarNotaItem').addEventListener('click', async ()=>{
    const nota = document.getElementById('notaItem').value.trim();
    if (!nota) return;
    await guardarItem({}, { tipo:'nota', nota }, { msg:'Novedad guardada.' });
  });
}

    <div class="page-head"><div><h1>Alistamiento de facturas</h1><div class="sub">Entrega de facturas físicas de proveedores a Contabilidad</div></div></div>
    <div class="empty-state" style="padding:70px 20px">
      <div class="big">Próximamente</div>
      Aquí vas a poder llevar el registro y la entrega de las facturas recibidas de proveedores hacia Contabilidad, conectado con el módulo de Facturación.
    </div>
  `;

/* ---------------- PANEL DE ESTADOS (crear estados nuevos por tipo) ---------------- */
const ESTADOS_TIPO_LABEL = { sc:'Solicitudes', oc:'Órdenes de Compra', rar:'Recepciones (RAR)', fact:'Facturación', item:'Ítems (todos los tipos)' };

async function renderEstadosPanel(){
  const panel = document.getElementById('estadosPanel');
  if (!panel) return;
  const cat = await ensureEstadosCatalog();
  panel.innerHTML = Object.keys(ESTADOS_TIPO_LABEL).map(k=>`
    <div style="margin-bottom:16px">
      <div style="font-weight:700;font-size:13px;margin-bottom:6px">${esc(ESTADOS_TIPO_LABEL[k])}</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">
        ${(cat[k]||[]).map(e=>badge(e)).join('')}
      </div>
      <div style="display:flex;gap:8px">
        <input type="text" id="nuevoEstado_${k}" placeholder="Nombre del estado nuevo…" style="flex:1;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12.5px;font-family:inherit">
        <button class="btn" data-tipo="${k}" data-action="addEstado" style="padding:7px 12px">Agregar</button>
      </div>
    </div>
  `).join('');
  panel.querySelectorAll('button[data-action="addEstado"]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const k = btn.dataset.tipo;
      const input = document.getElementById('nuevoEstado_'+k);
      const val = input.value.trim();
      if (!val) return;
      await addEstadosToCatalog(k, [val]);
      input.value = '';
      toast('Estado agregado.');
      renderEstadosPanel();
    });
  });
}

/* ---------------- IMPORTAR ---------------- */
const TIPO_ORDEN = ['sc','oc','rar','fact']; // orden de procesamiento: primero lo que otros documentos necesitan enlazar

function renderImportar(el){
  el.innerHTML = `
    <div class="page-head"><div><h1>Importar desde Excel</h1><div class="sub">Arrastra uno o varios archivos — la app detecta sola el tipo de documento y la empresa de cada fila (por "subsidiaria")</div></div></div>
    <div class="card" style="padding:20px;max-width:680px">
      <div class="drop" id="dropZone">
        <input type="file" id="fileInput" accept=".xlsx,.xls" multiple>
        <div id="dropLabel">Arrastra aquí uno o varios archivos .xlsx (Solicitudes, OC, RAR, Facturas — de cualquier mes), o haz clic para elegirlos</div>
      </div>
      <div id="fileList" style="margin-top:12px;font-size:12.8px"></div>
      <div id="impResult"></div>
      <button class="btn primary" id="btnImportar" style="margin-top:14px" disabled>Importar todo</button>
    </div>

    <div class="page-head" style="margin-top:32px"><div><h1 style="font-size:17px">Estados</h1><div class="sub">Crea estados nuevos para cada tipo de documento o para los ítems — quedan disponibles de inmediato en los selectores</div></div></div>
    <div class="card" style="padding:20px;max-width:680px" id="estadosPanel"></div>
  `;
  renderEstadosPanel();
  const drop = document.getElementById('dropZone');
  const input = document.getElementById('fileInput');
  const btn = document.getElementById('btnImportar');
  let files = [];

  function showFiles(){
    document.getElementById('fileList').innerHTML = files.length
      ? files.map(f=>`<div>• ${esc(f.name)}</div>`).join('')
      : '';
    btn.disabled = files.length===0;
    document.getElementById('dropLabel').textContent = files.length
      ? `${files.length} archivo(s) listo(s) — puedes seguir agregando o hacer clic en "Importar todo"`
      : 'Arrastra aquí uno o varios archivos .xlsx (Solicitudes, OC, RAR, Facturas — de cualquier mes), o haz clic para elegirlos';
  }
  drop.addEventListener('click', ()=> input.click());
  drop.addEventListener('dragover', e=>{ e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', ()=> drop.classList.remove('over'));
  drop.addEventListener('drop', e=>{
    e.preventDefault(); drop.classList.remove('over');
    files = files.concat(Array.from(e.dataTransfer.files));
    showFiles();
  });
  input.addEventListener('change', ()=>{
    files = files.concat(Array.from(input.files));
    showFiles();
  });

  btn.addEventListener('click', async ()=>{
    if (!files.length) return;
    if (!state.db){ toast('Sin conexión al almacenamiento.', true); return; }
    btn.disabled = true; btn.textContent = 'Leyendo archivos…';
    const resultsEl = document.getElementById('impResult');
    resultsEl.innerHTML = '';

    // 1) leer y clasificar cada archivo por tipo de documento (según sus hojas)
    const items = [];
    for (const file of files){
      try{
        const buf = await file.arrayBuffer();
        const wb = XLSX.read(buf, {type:'array', cellDates:true});
        const tipoKey = detectTipo(wb);
        if (!tipoKey){ items.push({name:file.name, error:'No reconocí las hojas de este archivo (se esperaba cab_xx/det_xx).'}); continue; }
        const { cab, det } = await parseWorkbookFile(wb, tipoKey);
        items.push({name:file.name, tipoKey, cab, det});
      }catch(e){
        items.push({name:file.name, error: e.message||String(e)});
      }
    }

    // 2) procesar en orden: SC, luego OC, luego RAR, luego Facturas (para maximizar los enlaces)
    items.sort((a,b)=>{
      const ia = a.tipoKey ? TIPO_ORDEN.indexOf(a.tipoKey) : 99;
      const ib = b.tipoKey ? TIPO_ORDEN.indexOf(b.tipoKey) : 99;
      if (ia!==ib) return ia-ib;
      return a.name.localeCompare(b.name);
    });

    const resumen = [];
    let totalSinResolver = 0;
    for (const it of items){
      if (it.error){ resumen.push({name:it.name, error:it.error}); continue; }
      btn.textContent = `Importando ${it.name}…`;
      try{
        const res = await runImport(it.tipoKey, it.cab, it.det);
        totalSinResolver += res.sinResolver;
        resumen.push({name:it.name, tipoKey:it.tipoKey, res});
      }catch(e){
        resumen.push({name:it.name, error: e.message||String(e)});
      }
    }

    resultsEl.innerHTML = `<div class="import-summary">
      ${resumen.map(r=>{
        if (r.error) return `<div style="color:var(--bad)">✕ ${esc(r.name)}: ${esc(r.error)}</div>`;
        const p = r.res;
        return `<div>✓ ${esc(r.name)} — <b>${TIPOS[r.tipoKey].plural}</b>: ${p.creados} creados, ${p.actualizados} actualizados${p.sinNumero?`, ${p.sinNumero} sin número`:''}${p.sinResolver?`, <span style="color:var(--warn)">${p.sinResolver} sin resolver empresa/vínculo</span>`:''}
          <div class="muted" style="font-size:11.5px;margin:2px 0 6px 14px">Sabbag: ${p.porEmpresa.sabbag} · Ciclotron: ${p.porEmpresa.ciclotron}</div>
        </div>`;
      }).join('')}
      ${totalSinResolver ? `<div style="margin-top:8px;color:var(--warn)">Hay ${totalSinResolver} fila(s) que no se pudieron ubicar en Sabbag o Ciclotron todavía — normalmente porque el documento del que dependen (Solicitud u OC) aún no se ha importado. Vuelve a importar ese mismo archivo después de cargar sus documentos relacionados.</div>` : ''}
    </div>`;
    toast('Importación completada.');
    state.cache = {};
    files = [];
    btn.disabled = false; btn.textContent = 'Importar todo';
    showFiles();
  });
}

/* ============================================================
   EVENTOS GLOBALES / ARRANQUE

document.querySelectorAll('.nav-item[data-route]').forEach(b=>{
  b.addEventListener('click', ()=> navigate(b.dataset.route));
});

  h.addEventListener('click', ()=>{

document.getElementById('companySwitch').querySelectorAll('.company-btn').forEach(b=>{
  b.addEventListener('click', ()=>{

    localStorage.setItem('compras_empresa', state.empresa);
    updateCompanyUI();
    state.cache = {};
    render();
  });
});
if (localStorage.getItem('compras_sidebar_collapsed')==='1') document.body.classList.add('sidebar-collapsed');
document.getElementById('sidebarToggle').addEventListener('click', ()=>{
  document.body.classList.toggle('sidebar-collapsed');
  localStorage.setItem('compras_sidebar_collapsed', document.body.classList.contains('sidebar-collapsed') ? '1' : '0');
});
function updateCompanyUI(){
  document.querySelectorAll('.company-btn').forEach(b=> b.classList.toggle('active', b.dataset.c===state.empresa));
}

(async function start(){
  updateCompanyUI();
  document.querySelector('.nav-item[data-route="dashboard"]').classList.add('active');
  await initCapabilities();
  // si intenta entrar directo a Importar sin permiso, lo manda al panel
  if (state.route==='importar' && !(state.me && state.me.canEdit)) state.route='dashboard';
  render();
})();
</script>
